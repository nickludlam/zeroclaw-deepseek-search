[package]
name = "deepseek-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw plugin: web search through the DeepSeek Search API"
repository = "https://github.com/nickludlam/zeroclaw-deepseek-search"
homepage = "https://github.com/nickludlam/zeroclaw-deepseek-search"
readme = "README.md"
keywords = ["zeroclaw", "plugin", "wasm", "deepseek", "search"]
publish = false

# `cdylib` builds the wasm32-wasip2 component; `rlib` keeps the wire logic
# host-testable with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# Blocking `wasi:http` for the component; omitted on the host so `cargo test`
# never needs a wasm toolchain.
waki = "0.5.1"
wit-bindgen = "0.51"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, not part of any host workspace.
[workspace]
